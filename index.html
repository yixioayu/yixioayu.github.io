<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>GOW 战队 · 知识文档</title>
<style>
:root{--bg:#fff;--fg:#1d2129;--muted:#6b7280;--line:#e5e7eb;--card:#f7f8fa;--accent:#2f6fed}
@media (prefers-color-scheme:dark){:root{--bg:#16181d;--fg:#e6e8eb;--muted:#9aa2ad;--line:#2a2e36;--card:#1e2229;--accent:#6a9bff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;line-height:1.7}
a{color:var(--accent);text-decoration:none}
.wrap{max-width:960px;margin:0 auto;padding:64px 24px 80px}
h1{font-size:34px;margin:0 0 10px;letter-spacing:1px}
.sub{color:var(--muted);margin:0 0 40px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{display:flex;flex-direction:column;gap:6px;padding:22px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--fg);transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease}
.card:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 6px 20px rgba(0,0,0,.06);text-decoration:none}
.ico{font-size:26px}
.t{font-size:18px;font-weight:700}
.d{font-size:14px;color:var(--muted);flex:1}
.go{font-size:13px;color:var(--accent);margin-top:6px}
.foot{text-align:center;color:var(--muted);font-size:13px;padding:28px 16px;border-top:1px solid var(--line);margin-top:48px}
</style>
</head>
<body>

        <span class="go">阅读 →</span>

      <a class="card" href="docs/linux.html">
